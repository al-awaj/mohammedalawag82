# Production stack on one server (docs/12-deployment.md). Copy .env.example to .env and fill it in, then:
#   docker compose build && docker compose up -d
# One-off jobs: docker compose run --rm backup | create-admin (see the guide).
name: events

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  JWT_SECRET: ${JWT_SECRET}
  CORS_ORIGINS: https://${WEB_DOMAIN},https://${ADMIN_DOMAIN},https://${PROVIDER_DOMAIN}
  # Requests reach the API through Caddy or the web servers, all on the private network below.
  TRUST_PROXY: 172.30.0.0/24
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}

x-api: &api
  image: ${IMAGE_PREFIX:-events}/api:${IMAGE_TAG:-latest}
  build: { context: .., target: api }
  restart: unless-stopped
  env_file: [{ path: ./secrets.env, required: false }]   # payment/messaging secrets named by secretRef
  environment: *api-env
  volumes: [storage:/data/storage]
  networks: [internal]

x-webapp: &webapp
  restart: unless-stopped
  environment: { API_URL: http://api:3000 }
  depends_on: { api: { condition: service_healthy } }
  networks: [internal]

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment: { POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: "${POSTGRES_DB}" }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"], interval: 5s, retries: 20 }
    networks: [internal]

  # Applies pending migrations and syncs reference data, then exits; the API starts only after it succeeds.
  migrate:
    <<: *api
    restart: "no"
    command: ["sh", "-c", "node dist/scripts/migrate.js && node dist/scripts/seed-reference.js"]
    depends_on: { postgres: { condition: service_healthy } }

  api:
    <<: *api
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker:
    <<: *api
    command: ["node", "dist/worker.js"]
    healthcheck: { disable: true }
    depends_on: { migrate: { condition: service_completed_successfully } }

  admin:
    <<: *webapp
    image: ${IMAGE_PREFIX:-events}/admin:${IMAGE_TAG:-latest}
    build: { context: .., target: webapp, args: { APP: admin, NEXT_PUBLIC_BRAND_AR: "${BRAND_AR:-}", NEXT_PUBLIC_BRAND_EN: "${BRAND_EN:-}" } }

  provider:
    <<: *webapp
    image: ${IMAGE_PREFIX:-events}/provider:${IMAGE_TAG:-latest}
    build: { context: .., target: webapp, args: { APP: provider, NEXT_PUBLIC_BRAND_AR: "${BRAND_AR:-}", NEXT_PUBLIC_BRAND_EN: "${BRAND_EN:-}" } }

  web:
    <<: *webapp
    image: ${IMAGE_PREFIX:-events}/web:${IMAGE_TAG:-latest}
    build: { context: .., target: webapp, args: { APP: web, NEXT_PUBLIC_BRAND_AR: "${BRAND_AR:-}", NEXT_PUBLIC_BRAND_EN: "${BRAND_EN:-}" } }

  # TLS termination with automatic certificates; the only service published to the internet.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      PROVIDER_DOMAIN: ${PROVIDER_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, admin, provider, web]
    networks: [internal]

  # On demand / from cron: docker compose run --rm backup
  backup:
    <<: *api
    restart: "no"
    profiles: [ops]
    command: ["node", "dist/scripts/backup.js", "/data/backups", "${BACKUP_KEEP:-14}"]
    volumes: [storage:/data/storage, ./backups:/data/backups]

  # docker compose run --rm create-admin --name "…" --email … --password '…'
  create-admin:
    <<: *api
    restart: "no"
    profiles: [ops]
    entrypoint: ["node", "dist/scripts/create-admin.js"]

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:

networks:
  internal:
    ipam: { config: [{ subnet: 172.30.0.0/24 }] }
