name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, unit and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: events_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d events_test" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/events_test
      S3_TEST_ENDPOINT: http://localhost:8333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Object storage for the S3 tests (SeaweedFS)
        run: docker run -d --name s3 -p 8333:8333 chrislusf/seaweedfs server -s3 -dir=/data -volume.max=100
      - run: npm ci
      - name: Typecheck all packages
        run: npm run typecheck
      - name: Shared packages
        run: |
          (cd packages/shared && npx vitest run)
          (cd packages/web-kit && npx vitest run)
      - name: Wait for object storage
        run: for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8333/ && break; sleep 2; done
      - name: API tests (functional, security, financial, concurrency, storage, backup/restore)
        run: npm --workspace apps/api test
      - name: Dependency audit (server-side and web, production dependencies)
        run: npm audit --omit=dev --workspace apps/api --workspace apps/admin --workspace apps/provider --workspace apps/web --audit-level=high
      - name: Mobile bundles compile for iOS and Android
        run: cd apps/mobile && CI=1 EXPO_NO_TELEMETRY=1 npm run export:native

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Build the interfaces
        run: npm run build:apps
        working-directory: e2e
        env: { CI: 1, EXPO_NO_TELEMETRY: 1, NEXT_TELEMETRY_DISABLED: 1 }
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: e2e/test-results, retention-days: 7 }

  images:
    name: Production images and stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [checks]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=build/; s|^JWT_SECRET=.*|JWT_SECRET=build|" .env
          docker compose build
      - name: Smoke test the stack (TLS, readiness, headers, admin sign-in, backup)
        working-directory: deploy
        run: ./smoke-test.sh
